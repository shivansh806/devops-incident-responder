# Week 3 event pipeline infrastructure: Kafka (KRaft, no ZooKeeper) and Redis.
#
# The Spring Boot app runs on the HOST, in IntelliJ - not in a container. That single
# fact drives every port and listener choice below. See docs/infra.md.
#
#   docker compose up -d --wait     bring it up and block until both are healthy
#   docker compose down             stop, keep the data
#   docker compose down -v          stop and wipe the volumes

services:
  kafka:
    image: apache/kafka:4.0.0
    container_name: incident-kafka
    ports:
      # Bound to 127.0.0.1, not 0.0.0.0. "9092:9092" would publish an unauthenticated
      # broker on every interface, including whatever WiFi this laptop is on.
      - "127.0.0.1:9092:9092"
    environment:
      # --- KRaft: this node is both broker and controller, so no ZooKeeper ---
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      # Pinned, not generated. It is written into meta.properties on the data volume;
      # a fresh id on the next 'up' would mismatch the volume and refuse to start.
      CLUSTER_ID: 8dwXVyjaS2mwTqSVRzVu9Q

      # --- Listeners: what the broker BINDS ---
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:29092,PLAINTEXT_HOST://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT

      # --- Advertised listeners: what the broker TELLS CLIENTS TO RECONNECT TO ---
      # This is the line that decides whether a host-run app works. A client uses
      # bootstrap-servers once, to fetch metadata, then reconnects to whatever address
      # comes back here. Advertise only "kafka:29092" and the host app connects, then
      # hangs forever trying to resolve a Docker-internal name.
      #   PLAINTEXT_HOST -> localhost:9092  the app in IntelliJ
      #   PLAINTEXT      -> kafka:29092     containers on this network (week 4)
      # CONTROLLER is deliberately absent: it speaks Raft, not the client protocol.
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092

      # --- Single-broker sizing. These default to 3 and would leave the internal
      # consumer-offsets topic permanently under-replicated on a one-node cluster. ---
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_DEFAULT_REPLICATION_FACTOR: 1
      KAFKA_NUM_PARTITIONS: 1
      # Default is 3000ms, which makes every consumer restart feel broken in dev.
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      # Explicit rather than relying on the default: step 2 can produce to a topic
      # before anything creates it. Revisit if topics need real partition counts.
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"

      # The image defaults to /tmp/kraft-combined-logs, which is inside the container
      # filesystem - every recreate would lose topics, offsets and the cluster id.
      KAFKA_LOG_DIRS: /var/lib/kafka/data
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      # Exec form, no shell: asks the broker over its own client protocol, so a
      # "healthy" here means a client can actually get metadata back.
      test: ["CMD", "/opt/kafka/bin/kafka-broker-api-versions.sh", "--bootstrap-server", "localhost:9092"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 20s

  redis:
    image: redis:7.4-alpine
    container_name: incident-redis
    ports:
      - "127.0.0.1:6379:6379"
    # Redis has no advertised-address problem: a client talks to the socket it opened
    # and is never redirected. (Redis Cluster's MOVED is the same class of problem -
    # part of why single-node is the right call for a cache.)
    #
    # AOF on, because the thing being cached is Groq responses against a 100k
    # tokens/day budget. Losing the cache on restart costs real quota.
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ---------------------------------------------------------------------------
  # The application, bundle included. Behind the 'app' profile ON PURPOSE.
  #
  #   docker compose up -d --wait                  Kafka + Redis only, unchanged.
  #                                                The app runs in IntelliJ as always.
  #   docker compose --profile app up -d --wait    the whole stack, one origin on 8080.
  #
  # Without the profile this service would take port 8080 every time Kafka came up and
  # collide with the IntelliJ instance - so the default 'up' deliberately does not start
  # it, and the daily development loop is exactly what it was in week 3.
  # ---------------------------------------------------------------------------
  app:
    profiles: ["app"]
    build:
      context: .
      dockerfile: Dockerfile
    container_name: incident-app
    ports:
      # Same 127.0.0.1 discipline as the other two. This one carries the incident corpus
      # and an unauthenticated WebSocket, so publishing it on every interface would put
      # the whole diagnosis history on whatever network this laptop is on.
      - "127.0.0.1:8080:8080"

    # GROQ_API_KEY and MONGODB_URI. Passed as container environment rather than by
    # copying .env into the image - .dockerignore excludes it, because a secret written
    # into a layer stays readable in that layer even if a later one deletes it. The app
    # normally reads .env through spring-dotenv on the host; in a container there is no
    # file to read and these arrive as ordinary environment variables instead.
    env_file: .env

    environment:
      # Container-network addresses, not localhost. This is the payoff for a decision
      # made in week 3: KAFKA_ADVERTISED_LISTENERS has advertised PLAINTEXT://kafka:29092
      # since step 1, commented "containers on this network - week 4". A client fetches
      # metadata once and then reconnects to whatever the broker advertised, so this
      # address had to already be correct; it could not be bolted on now.
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      REDIS_HOST: redis
      REDIS_PORT: 6379

      # Empty, and that IS the setting - not an oversight and not a placeholder.
      #
      # The bundle and the API are served by this one process, so the browser loads
      # http://localhost:8080 and opens a socket back to http://localhost:8080. Origin
      # equals target. Spring's rule with NO configured origins is same-origin only,
      # which is both correct here and stricter than any list that could be written.
      #
      # Listing http://localhost:8080 explicitly would be worse than empty, not the same:
      # it breaks the moment this is reached as 127.0.0.1:8080 or over a LAN address,
      # where the same-origin default just follows whatever host served the page. And
      # shipping the dev ports would be exactly the dead-origin-config failure that
      # addCorsMappings was rejected for in docs/frontend.md.
      #
      # WebSocketConfig.effectiveOrigins filters blanks so this reaches Spring as an
      # empty array rather than as one origin equal to "" - which would be a NON-empty
      # allowlist matching nothing and would refuse every connection, same-origin
      # included. WebSocketConfigTest pins that.
      INCIDENT_WEBSOCKET_ALLOWED_ORIGINS: ""

    depends_on:
      # service_healthy, not the default service_started. Both dependencies have real
      # healthchecks above and Spring Boot fails its Kafka connection at startup, so
      # waiting for the process to exist rather than to answer is the same ten-second
      # race docs/infra.md already documents for the host case.
      kafka:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

volumes:
  kafka-data:
  redis-data:
