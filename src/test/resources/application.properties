# Test-scoped overrides. Spring Boot loads this alongside src/main/resources/application.yml
# rather than instead of it - .properties wins over .yml at the same location, so everything
# not named here still comes from the real configuration.

# Keeps `mvn test` offline. Without this every @SpringBootTest would start a listener container
# and sit retrying a connection to localhost:9092, which turns an offline test suite into one
# that quietly depends on docker compose being up. The container is still created, so wiring
# errors in KafkaConsumerConfig still fail the context test - only delivery is held.
incident.kafka.consumer-enabled=false
