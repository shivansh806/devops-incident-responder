spring:
  application:
    name: devops-incident-responder
  data:
    mongodb:
      # Sourced from MONGODB_URI in .env, same pattern as GROQ_API_KEY - but note the
      # default differs. An empty API key is still a valid string that simply fails at
      # call time; an empty connection string cannot be parsed and would stop the context
      # from starting at all. So the fallback is a local Mongo rather than "".
      uri: ${MONGODB_URI:mongodb://localhost:27017}
      # Set explicitly because an Atlas connection string copied out of the UI usually
      # carries no database name, and Spring's fallback in that case is "test" - which
      # would look like it worked while writing to the wrong place. This property wins
      # over any database named in the URI.
      database: ${MONGODB_DATABASE:incident_responder}

server:
  port: 8080

langchain4j:
  open-ai:
    chat-model:
      # Groq is OpenAI-API-compatible, so the OpenAI model works against its base URL.
      base-url: https://api.groq.com/openai/v1
      # Sourced from the GROQ_API_KEY environment variable. The empty default keeps the
      # app bootable without a key (calls then fail with 401 rather than the context
      # failing to start) - never put a literal key here.
      api-key: ${GROQ_API_KEY:}
      model-name: llama-3.3-70b-versatile
      temperature: 0.2
      timeout: 60s
      log-requests: false
      log-responses: false
