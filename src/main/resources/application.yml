spring:
  application:
    name: devops-incident-responder
  data:
    mongodb:
      # Sourced from MONGODB_URI in .env, same pattern as GROQ_API_KEY - but note the
      # default differs. An empty API key is still a valid string that simply fails at
      # call time; an empty connection string cannot be parsed and would stop the context
      # from starting at all. So the fallback is a local Mongo rather than "".
      uri: ${MONGODB_URI:mongodb://localhost:27017}
      # Set explicitly because an Atlas connection string copied out of the UI usually
      # carries no database name, and Spring's fallback in that case is "test" - which
      # would look like it worked while writing to the wrong place. This property wins
      # over any database named in the URI.
      database: ${MONGODB_DATABASE:incident_responder}

    redis:
      # localhost:6379 are Spring's defaults and docker-compose.yml publishes there on
      # purpose; spelled out so the dependency is visible and week 4 has an override point.
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      # A cache must never be the slow part of a request. If Redis cannot answer in two
      # seconds, AnalysisCache logs and treats it as a miss.
      timeout: 2s

  kafka:
    # localhost:9092 is also Spring's own default. It is spelled out because docker-compose.yml
    # chose that port deliberately to make it so - see docs/infra.md - and an env override is
    # what week 4 will need when the app moves into a container.
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}

    consumer:
      group-id: incident-responder
      # String in, parsed by IncidentEventParser in the listener. Not Spring Kafka's
      # JsonDeserializer: a deserialiser failure happens before the listener runs, which needs
      # an ErrorHandlingDeserializer wrapper to avoid an infinite poison-pill loop. Parsing in
      # the listener makes a malformed message an ordinary exception the error handler already
      # classifies, and it keeps the choice of ObjectMapper explicit rather than inherited.
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer

      # ONE. Not a tuning preference - a correctness requirement. The default is 500, and a
      # poll returning 500 events would hand the listener ~17 hours of LLM calls to run inside
      # a 10 minute poll interval. The broker would evict this consumer mid-batch and redeliver
      # every event in it, including the ones already billed for. Throughput is irrelevant
      # here: Groq's rate limit caps this pipeline far below one event per second anyway.
      max-poll-records: 1

      # auto-offset-reset is deliberately left at Kafka's default of "latest", against the
      # advice of every tutorial. It only applies when a group has no committed offset, and
      # "earliest" there means replaying the entire topic the first time the app starts - at
      # ~9,800 tokens an event, potentially the whole day's budget before the first log line.
      # An existing group resumes from its committed offsets either way, which is the case
      # that actually matters.

      properties:
        # Raised from the 5 minute default. The budget it has to cover: one event is two LLM
        # calls at a 60s timeout each (~125s), and a retry adds a 60s backoff plus a second
        # attempt - 310s worst case. Five minutes would lose that race; ten has margin.
        max.poll.interval.ms: 600000

    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer

    listener:
      # Commit after each record rather than after each poll batch. With max-poll-records at 1
      # these are the same thing today; stating it means the guarantee does not quietly change
      # if that number is ever raised.
      ack-mode: RECORD

server:
  port: 8080

langchain4j:
  open-ai:
    chat-model:
      # Groq is OpenAI-API-compatible, so the OpenAI model works against its base URL.
      base-url: https://api.groq.com/openai/v1
      # Sourced from the GROQ_API_KEY environment variable. The empty default keeps the
      # app bootable without a key (calls then fail with 401 rather than the context
      # failing to start) - never put a literal key here.
      api-key: ${GROQ_API_KEY:}
      # llama-3.3-70b-versatile was retired by Groq and now 404s. Of what Groq still
      # serves, this is the only sound choice: qwen/qwen3.6-27b writes its <think> block
      # inline in `content` and cannot drive LangChain4j's prompt-based JSON path at all,
      # groq/compound is an agentic system with built-in web search, and allam-2-7b has a
      # 4k context that the Analyzer prompt alone overflows. Measured in ModelCandidateProbe.
      #
      # EVERY NUMBER IN docs/baseline.md AND docs/resolver.md PREDATES THIS. They were
      # measured on the retired model and have not been re-measured. See those files.
      model-name: openai/gpt-oss-120b
      # Pinned, not left to the default, because gpt-oss is a reasoning model and the effort
      # level is a hidden input that Groq could change under us - which would look exactly
      # like model drift in a baseline run. `medium` is what the default resolves to today
      # (measured: 134 completion tokens unset vs 120 at medium), so pinning it changes
      # nothing today and stops it changing tomorrow.
      #
      # `low` is not worth it: measured on a real Analyzer call it saves 7% (4,757 vs 5,121
      # total) because input dominates at 4,109 tokens and is fixed by the prompt. `high` is
      # disqualified - 1,577 completion tokens on a *toy* prompt, a fifth of the minute
      # budget for one trivial call.
      reasoning-effort: medium
      temperature: 0.2
      timeout: 60s
      log-requests: false
      log-responses: false

incident:
  resolver:
    # Paid only when the Resolver is actually refused, never on a call that fits.
    #
    # Derived, not picked: the per-minute bucket is 8,000 tokens refilling at ~133/second, and
    # one event's deficit is analyzer + resolver - 8000. Measured live at 4,715 + 3,585 = 8,300,
    # a deficit of 300, which Groq itself priced at 2.25s. Against the largest measured Analyzer
    # call (5,121) it is 706, or 5.3s. 15s covers a deficit of ~2,000 - room for longer log
    # dumps and more verbose retrieved precedent.
    #
    # This is NOT a fixed delay between the two agents. That would have slowed POST /api/analyze
    # too, since both entry points share IncidentService.analyzeAndRecord, and would have been
    # wasted whenever the Analyzer came from cache and the Resolver had the whole bucket anyway.
    rate-limit-backoff: 15s

  cache:
    # A response cache for Analyzer calls. The motivation is quota, not latency: one call is
    # 5,121 measured tokens against 100,000 a day, and a hit takes nothing out of the 8,000
    # per-minute bucket either - which is what leaves room for the Resolver.
    #
    # SET THIS FALSE FOR ANY MEASUREMENT RUN. AnalyzerStabilityTest asks whether the model
    # answers identically three times; with the cache on, runs two and three are hits and it
    # passes without measuring anything. src/test/resources/application.properties turns it
    # off for every test for that reason.
    enabled: true
    # The key already covers model id, reasoning effort, both prompts, the output schema and
    # the enum vocabularies - see AnalysisCacheKey. What it cannot cover is Groq changing the
    # weights behind gpt-oss-120b without renaming it. This bounds how long that can go
    # unnoticed, and is the only reason there is a TTL at all.
    ttl: 7d

  websocket:
    # Where the week 4 dashboard connects. Raw WebSocket, not STOMP - one broadcast of one
    # type to every client has nothing to route, and STOMP would make the frontend learn a
    # second wire protocol on top of the JSON. See docs/websocket.md.
    path: /ws/incidents

    # How many past incidents a connecting client is replayed, tagged as `history` frames.
    #
    # Not zero because of the quota, not because of taste: at ~10 events a day the gap between
    # incidents is hours, and a live-only stream leaves the dashboard blank for most of a
    # working day - which is indistinguishable from a broken one. Note that on a database with
    # no live traffic these ten are ENTIRELY seeded incidents; the newest seeded analyzedAt is
    # 2026-08-09. Their null resolution means "never asked", which is exactly what the frame
    # type is for. Set 0 for a live-only stream.
    backlog: 10

    # The handshake is an HTTP request but is NOT subject to CORS - the browser will not refuse
    # a cross-origin connection, so the server must. Spring's default is same-origin, which
    # would refuse week 4's Vite dev server on 5173 with a handshake failure that reads like a
    # wrong URL. Listed rather than "*": a wildcard lets any page on the internet open a stream
    # of this system's incident data, and it is the kind of default nothing ever flags.
    #
    # localhost:8080 is this app's OWN origin and is listed because a non-empty list
    # REPLACES Spring's same-origin default rather than adding to it - without it, a browser
    # console opened on the running app is refused its own socket, which is the first thing
    # anyone tries. A command-line client (websocat, wscat) sends no Origin header at all and
    # is allowed regardless.
    allowed-origins: http://localhost:5173,http://localhost:3000,http://localhost:8080

  kafka:
    topic: incident-events
    # A quota switch, not a feature flag. False leaves the listener container stopped, so the
    # simulator can fill the topic for free and the events can be inspected before any Groq
    # call is paid for. Offsets are untouched - the group is the same, so enabling it later
    # resumes rather than replays.
    consumer-enabled: true

  simulator:
    # Three, not eight, because each event costs ~9,800 Groq tokens against 100,000 per day.
    # A full eight-scenario run is ~78,000 - most of the daily budget. See IncidentSimulator.
    count: 3
    # 120s, and NOT derived from tokens per event. That calculation says 62-74s (8,000 refilling
    # at 133/s against an event of 8,308 measured or 9,800 estimated) and it is wrong - the live
    # run on 2026-08-20 collided at 90s, well above both figures. Per-event cost is not what
    # binds here.
    #
    # What binds is Groq's 60-SECOND WINDOW plus our own retry. A cold event's Resolver is
    # refused, waits 15s and retries, so the event's LAST BILLED CALL lands ~25-35s after the
    # event began (analyzer latency + the 15s backoff). The next event is only clear once that
    # call has aged out of the trailing 60s: 85-95s. 90s sat inside that band, which is exactly
    # what "3 of 4 events resolved, 1 degraded" looks like. 120s puts ~30s of margin on it.
    #
    # It costs nothing to be generous. The DAILY budget already caps this at ~10 events, so the
    # interval has never been the limit on how much can be run in a day - only on whether an
    # event pays for its own recommendation.
    #
    # NOTE this still does not fix the harder problem: an event's two calls run back to back and
    # together exceed the 8,000 bucket, so the Resolver 429s within a single event no matter how
    # far apart events are. That is what ResolverService's 15s retry is for, and a full bucket is
    # what gives the retry its headroom - which is the whole reason the interval matters at all.
    interval: 120s
